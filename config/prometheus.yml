global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'pulse-local'
    env: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alerts.yml"

# PulseMetrics'in KENDI olculeri.
#
# Dairesel bagimliliktan kacinmak icin PulseMetrics kendini izlemez:
# collector coktugunde bunu haber verecek sey baska bir sistem olmali.
# Buradaki Prometheus tam olarak o sistem.
#
# Adresler hakkinda: host.docker.internal, konteynerin icinden ANA
# MAKINEYI gosterir. Bu, sureclerin "go run" ile makinede calistigi
# gelistirme akisi icindir. Konteynerde calistiriyorsan
# (docker-compose.apps.yml) config/prometheus-apps.yml kullanilir; orada
# hedefler servis adlaridir.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pulse-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          component: 'collector'

  - job_name: 'pulse-agent'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          component: 'agent'

  - job_name: 'pulse-dashboard-api'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          component: 'dashboard-api'

  # Kafka JMX exporter (kurulursa)
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka:9999']

  # ScyllaDB'nin kendi Prometheus ucu 9180'de yayin yapar
  # - job_name: 'scylladb'
  #   static_configs:
  #     - targets: ['scylladb:9180']
