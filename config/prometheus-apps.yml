# Uygulamalar konteynerde calisirken kullanilan Prometheus ayari.
#
# Fark tek satirlik ama onemli: hedefler host.docker.internal degil,
# Docker aginin cozdugu SERVIS ADLARI. Ayni ag icinde konteynerler
# birbirini adiyla bulur.
#
# Kullanimi (docker-compose.apps.yml bunu otomatik baglar):
#   docker compose -f docker-compose.apps.yml up -d --build
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'pulse-local'
    env: 'compose'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pulse-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['collector-1:8082', 'collector-2:8082']
        labels:
          component: 'collector'

  - job_name: 'pulse-dashboard-api'
    static_configs:
      - targets: ['dashboard-api:8080']
        labels:
          component: 'dashboard-api'
