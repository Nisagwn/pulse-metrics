syntax = "proto3";

package pulse.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nisah/pulse-metrics/pkg/pulsepb";

// MetricsPayload: batch of metrics from agent
message MetricsPayload {
  string service_name = 1;
  string instance_id = 2;
  repeated Metric metrics = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Metric: single metric data point
message Metric {
  string name = 1;
  MetricType type = 2;
  double value = 3;
  map<string, string> tags = 4;
  map<string, string> labels = 5;
  int64 timestamp_millis = 6;
}

// MetricType: gauge, counter, histogram, summary
enum MetricType {
  GAUGE = 0;
  COUNTER = 1;
  HISTOGRAM = 2;
  SUMMARY = 3;
}

// HistogramBucket: for histogram distributions
message HistogramBucket {
  double le = 1;  // less-than-equal boundary
  int64 count = 2;
}

// SummaryValue: for quantile summaries
message SummaryValue {
  double quantile = 1;
  double value = 2;
}

// MetricsQuery: query request for historical metrics
message MetricsQueryRequest {
  string service_name = 1;
  string metric_name = 2;
  map<string, string> filters = 3;
  int64 start_time_ms = 4;
  int64 end_time_ms = 5;
  int32 limit = 6;
  string aggregation = 7;  // "avg", "sum", "max", "min", "p50", "p95", "p99"
  string instance_id = 8;  // bos ise tum instance'lar
}

// MetricsQueryResponse: aggregated historical metrics
message MetricsQueryResponse {
  repeated TimeSeriesData series = 1;
  int64 query_time_ms = 2;
}

// TimeSeriesData: time-indexed metric values
message TimeSeriesData {
  string metric_name = 1;
  map<string, string> tags = 2;
  repeated DataPoint points = 3;
  string instance_id = 4;
  MetricType type = 5;
}

// DataPoint: single timestamp + value
message DataPoint {
  int64 timestamp_ms = 1;
  double value = 2;
}

// AlertRule: define alerting conditions
message AlertRule {
  string rule_id = 1;
  string service_name = 2;
  string metric_name = 3;
  // condition: "<toplama> <operator> <sayi>"
  //   toplama : avg | sum | min | max | last | p50 | p95 | p99 | zscore
  //   operator: > | >= | < | <=
  // Ornek: "p95 > 500", "zscore > 3"
  // zscore istatistiksel anomali tespitidir: son deger, daha uzun bir
  // gecmisin ortalamasindan kac standart sapma uzakta?
  string condition = 4;
  int32 duration_seconds = 5;   // degerlendirme penceresi
  string webhook_url = 6;
  bool enabled = 7;
  int64 created_at_ms = 8;
  AlertSeverity severity = 9;
  string name = 10;
}

// Alert: fired alert notification
message Alert {
  string rule_id = 1;
  string service_name = 2;
  double metric_value = 3;
  string message = 4;
  int64 timestamp_ms = 5;
  AlertSeverity severity = 6;
  string metric_name = 7;
  string condition = 8;
  string rule_name = 9;
  bool resolved = 10;         // true ise: alarm sona erdi bildirimi
  double threshold = 11;
}

enum AlertSeverity {
  INFO = 0;
  WARNING = 1;
  CRITICAL = 2;
}

// ---------------------------------------------------------------------------
// Servis tanimi: collector'in disariya actigi okuma API'si
// ---------------------------------------------------------------------------

// ListSeriesRequest: hangi seriler var?
message ListSeriesRequest {
  string service_name = 1;  // bos ise tum servisler
}

message ListSeriesResponse {
  repeated SeriesRef series = 1;
}

// SeriesRef: bir zaman serisinin kimligi (partition key)
message SeriesRef {
  string service_name = 1;
  string metric_name = 2;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;      // bagimliliklar (ScyllaDB) erisilebilir mi?
  string detail = 2;
  int64 uptime_seconds = 3;
}

// MetricsService: dashboard-api bu servisi cagirir
service MetricsService {
  // Query: bir metrigin zaman araligindaki degerleri
  rpc Query(MetricsQueryRequest) returns (MetricsQueryResponse);
  // ListSeries: bilinen (servis, metrik) ciftleri
  rpc ListSeries(ListSeriesRequest) returns (ListSeriesResponse);
  // Health: canlilik ve hazir olma durumu
  rpc Health(HealthRequest) returns (HealthResponse);
}

// ---------------------------------------------------------------------------
// Servis tanimi: alarm kurallari ve tetiklenen alarmlar
// ---------------------------------------------------------------------------

message CreateRuleResponse {
  string rule_id = 1;
}

message ListRulesRequest {
  string service_name = 1;  // bos ise hepsi
}

message ListRulesResponse {
  repeated AlertRule rules = 1;
}

message DeleteRuleRequest {
  string rule_id = 1;
}

message DeleteRuleResponse {
  bool deleted = 1;
}

message ListAlertsRequest {
  string service_name = 1;
  int64 start_time_ms = 2;
  int64 end_time_ms = 3;
  int32 limit = 4;
  bool firing_only = 5;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
  // active_rule_ids: su anda tetiklenmis durumdaki kurallar
  repeated string active_rule_ids = 2;
}

// EvaluateRulesRequest: kurallari hemen degerlendir (test ve demo icin).
message EvaluateRulesRequest {
  string rule_id = 1;  // bos ise tum etkin kurallar
}

message EvaluateRulesResponse {
  repeated Alert fired = 1;
  int32 evaluated = 2;
}

service AlertService {
  rpc CreateRule(AlertRule) returns (CreateRuleResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc EvaluateRules(EvaluateRulesRequest) returns (EvaluateRulesResponse);
}
